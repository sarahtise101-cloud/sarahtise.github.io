<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah Tise | Portfolio</title>
    <style>
        :root {
            --bg-dark: #0f0b1e;
            --bg-card: #1a1429;
            --primary-purple: #3d1b5c;
            --accent-pink: #e60073;
            --accent-magenta: #ff007f;
            --text-light: #f1f1f1;
            --text-gray: #b8b5c9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(15, 11, 30, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 0, 127, 0.2);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-light);
            text-transform: uppercase;
            cursor: pointer;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

            text-decoration: none;
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
