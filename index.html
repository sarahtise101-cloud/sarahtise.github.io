<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah Tise | Portfolio</title>
    <style>
        :root {
            --bg-dark: #0f0b1e;
            --bg-card: #1a1429;
            --primary-purple: #3d1b5c;
            --accent-pink: #e60073;
            --accent-magenta: #ff007f;
            --text-light: #f1f1f1;
            --text-gray: #b8b5c9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(15, 11, 30, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 0, 127, 0.2);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-light);
            text-transform: uppercase;
            cursor: pointer;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--accent-magenta);
        }

        /* Dropdown Menu for Projects */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--bg-card);
            min-width: 260px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 6px;
            z-index: 1;
            list-style: none;
            padding: 10px 0;
        }

        .dropdown-content li a {
            color: var(--text-light);
            padding: 10px 20px;
            display: block;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .dropdown-content li a:hover {
            background-color: var(--primary-purple);
            color: var(--accent-magenta);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Sections */
        section {
            display: none;
            min-height: 100vh;
            padding: 140px 10% 80px 10%;
            animation: fadeIn 0.5s ease-in-out;
        }

        section.active-section {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Home / About Me Section Styling */
        .about-container {
            display: flex;
            align-items: flex-start;
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .profile-img-box {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-magenta), var(--primary-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            flex-shrink: 0;
        }

        .profile-img-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #2b1f47;
        }

        .about-text h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .about-text p {
            font-size: 1.05rem;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-magenta {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-magenta));
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(230, 0, 115, 0.4
